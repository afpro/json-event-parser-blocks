[package]
name = "json-event-parser-blocks"
version = "0.1.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/afpro/json-event-parser-blocks"
repository = "https://github.com/afpro/json-event-parser-blocks"
description = "add 'skipper' and serde support for json-event-parser"
readme = "README.md"

[dependencies]
json-event-parser = "0.2"
serde = { version = "1", optional = true }
thiserror = "2"

[features]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
